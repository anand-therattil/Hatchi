# Infrastructure only: the FastAPI app runs on the host (uvicorn).
#
#   docker compose up -d                    Redis + MongoDB + Chroma          (any machine)
#   docker compose --profile gpu up -d      ... plus vLLM                     (Linux + NVIDIA GPU)
#
# vLLM sits behind the "gpu" profile so a plain `docker compose up` still works on machines
# without an NVIDIA GPU (e.g. a Mac). Settings are read from the shell or from ./.env, so VLLM_MODEL
# below and the app's VLLM_MODEL are one value.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: ["redis-server", "--appendonly", "yes"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  chroma:
    image: chromadb/chroma:latest   # pin a tag that matches the chromadb client in requirements.txt
    ports: ["8001:8000"]            # 8001 on the host so it doesn't clash with uvicorn on 8000
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes: ["chroma_data:/data"]

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest  # pin a release tag for reproducible deploys
    # The image's entrypoint is the OpenAI-compatible server; these are its arguments.
    command:
      - "--model"
      - "${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-4096}"                      # chat window is small; saves KV-cache memory
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
    ports: ["8002:8000"]            # 8002 on the host: 8000 = app, 8001 = Chroma
    ipc: host                       # shared memory, required by vLLM's multiprocessing
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"     # required for gated models such as Llama 3.2
    volumes:
      - "hf_cache:/root/.cache/huggingface"   # keep downloaded weights across restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s            # first start downloads and loads the model
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
  chroma_data:
  hf_cache:
